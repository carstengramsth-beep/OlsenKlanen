<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olsenklanens slagsang</title>
<style>
  :root{
    --blaa:#3a4a8c;
    --blaa-moerk:#2b3568;
    --papir:#f3f1ea;
    --guld:#c9a14a;
    --skygge:rgba(20,26,55,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    background:radial-gradient(120% 90% at 50% 0%, #46538f 0%, #2b3568 60%, #1e2650 100%);
    color:var(--papir);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }
  .topbar{
    display:flex;align-items:center;gap:14px;
    padding:14px 20px;
    background:rgba(20,26,55,.45);
    backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(201,161,74,.4);
    position:sticky;top:0;z-index:50;
  }
  .hjem{
    display:inline-flex;align-items:center;gap:8px;
    text-decoration:none;color:var(--papir);
    border:1px solid rgba(201,161,74,.6);
    padding:8px 16px;border-radius:30px;
    font-size:15px;letter-spacing:.02em;transition:.2s;white-space:nowrap;
  }
  .hjem:hover{background:var(--guld);color:#1e2650;border-color:var(--guld);}
  .titel{font-size:clamp(16px,2.4vw,22px);letter-spacing:.06em;margin:0;font-weight:600;}
  .titel small{display:block;font-size:.62em;opacity:.7;letter-spacing:.14em;font-weight:400;}
  .topbar .spacer{flex:1;}
  .info45{font-size:13px;opacity:.65;letter-spacing:.08em;white-space:nowrap;}

  .scene{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:26px 16px 10px;
    min-height:0;
  }
  .bog{
    position:relative;
    height:min(100%, 1100px);
    aspect-ratio:1270 / 1813;
    max-width:94vw;
    transition:opacity .12s;
  }
  .ark{
    position:absolute;inset:0;border-radius:5px;
    box-shadow:0 26px 60px -18px var(--skygge);
    background:var(--blaa);overflow:hidden;
    cursor:zoom-in;
  }
  .ark img{width:100%;height:100%;object-fit:contain;display:block;background:var(--blaa);}

  /* blad-animation */
  .bog.flip-next .ark{animation:flipNext .42s ease;}
  .bog.flip-prev .ark{animation:flipPrev .42s ease;}
  @keyframes flipNext{
    0%{transform:perspective(1600px) rotateY(0);opacity:1;}
    45%{transform:perspective(1600px) rotateY(-18deg);opacity:.55;}
    100%{transform:perspective(1600px) rotateY(0);opacity:1;}
  }
  @keyframes flipPrev{
    0%{transform:perspective(1600px) rotateY(0);opacity:1;}
    45%{transform:perspective(1600px) rotateY(18deg);opacity:.55;}
    100%{transform:perspective(1600px) rotateY(0);opacity:1;}
  }

  .kontrol{
    display:flex;align-items:center;justify-content:center;gap:18px;
    padding:14px 16px 24px;user-select:none;
  }
  .knap{
    width:54px;height:54px;border-radius:50%;
    border:1px solid rgba(201,161,74,.6);
    background:rgba(20,26,55,.4);color:var(--papir);
    font-size:22px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.18s;
  }
  .knap:hover:not(:disabled){background:var(--guld);color:#1e2650;}
  .knap:disabled{opacity:.3;cursor:default;}
  .sideinfo{min-width:150px;text-align:center;font-size:15px;letter-spacing:.05em;opacity:.85;}
  .sideinfo b{color:var(--guld);}
  .hint{text-align:center;font-size:13px;opacity:.5;letter-spacing:.05em;padding-bottom:18px;}

  /* ZOOM-OVERLAY */
  .zoom{
    position:fixed;inset:0;z-index:200;
    background:#0f132a;
    display:none;
    overflow:hidden;
    touch-action:none;
  }
  .zoom.aaben{display:block;}
  .zoom-luk{
    position:fixed;top:16px;right:18px;z-index:210;
    width:48px;height:48px;border-radius:50%;
    border:1px solid rgba(201,161,74,.6);
    background:rgba(20,26,55,.7);color:var(--papir);
    font-size:24px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .zoom-luk:hover{background:var(--guld);color:#1e2650;}
  .zoom-vejled{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    z-index:210;font-size:13px;color:var(--papir);opacity:.75;
    background:rgba(20,26,55,.65);padding:7px 16px;border-radius:20px;
    white-space:nowrap;text-align:center;
  }
  .zoom-flade{
    position:absolute;inset:0;
    overflow:hidden;
    cursor:grab;
  }
  .zoom-flade.griber{cursor:grabbing;}
  .zoom-img{
    position:absolute;top:0;left:0;
    transform-origin:0 0;
    user-select:none;-webkit-user-drag:none;
    image-rendering:auto;
    border-radius:0;
  }
</style>
</head>

  <header class="topbar">
    <a class="hjem" href="forside.html">⌂ Forside</a>
    <a class="hjem" href="musik.html">Sange</a>
    <h1 class="titel">Olsenklanens slagsang <small>KLANENS EGEN SANG</small></h1>
    <span class="spacer"></span>
    <span class="info45">Klik på siden for at zoome · bladr ← →</span>

  <main class="scene">
    <div class="bog" id="bog">

  <div class="kontrol">
    <button class="knap" id="prev" aria-label="Forrige">‹</button>
    <div class="sideinfo" id="sideinfo">Forside</div>
    <button class="knap" id="next" aria-label="Næste">›</button>
  </div>
  <div class="hint">Tip: klik på siden for at zoome ind · bladr med ← → · swipe på mobil.</div>

  <!-- ZOOM-OVERLAY -->
  <div class="zoom" id="zoom">
    <button class="zoom-luk" id="zoom-luk" aria-label="Luk">✕</button>
    <div class="zoom-flade" id="zoom-flade">
      <img class="zoom-img" id="zoom-img" alt="">
    </div>
    <div class="zoom-vejled">Dobbeltklik = zoom ind/ud · træk for at flytte · ✕ lukker</div>

<script>
(function(){
  const bog=document.getElementById('bog');
  const side=document.getElementById('side');
  const sideinfo=document.getElementById('sideinfo');
  const prev=document.getElementById('prev');
  const next=document.getElementById('next');

  const labels=['Slagsangen'];
  const N=PAGES.length;
  let i=0,busy=false;

  function render(){
    side.src=PAGES[i];
    side.alt=labels[i];
    sideinfo.innerHTML='<b>'+labels[i]+'</b> &nbsp;·&nbsp; '+(i+1)+'/'+N;
    prev.disabled=(i===0);
    next.disabled=(i===N-1);
  }
  function go(dir){
    if(busy)return;
    const t=i+dir;
    if(t<0||t>=N)return;
    busy=true;
    bog.classList.add(dir>0?'flip-next':'flip-prev');
    setTimeout(()=>{ i=t; render(); },190);
    setTimeout(()=>{ bog.classList.remove('flip-next','flip-prev'); busy=false; },430);
  }

  prev.addEventListener('click',()=>go(-1));
  next.addEventListener('click',()=>go(1));
  document.addEventListener('keydown',e=>{
    if(zoomAaben){ if(e.key==='Escape')lukZoom(); return; }
    if(e.key==='ArrowLeft')go(-1);
    if(e.key==='ArrowRight')go(1);
  });

  // Swipe = bladr (kun hvis fingeren bevæger sig tydeligt vandret)
  let sx=null, sy=null;
  bog.addEventListener('touchstart',e=>{sx=e.touches[0].clientX; sy=e.touches[0].clientY;},{passive:true});
  bog.addEventListener('touchend',e=>{
    if(sx===null)return;
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy))go(dx<0?1:-1);
    sx=null;sy=null;
  },{passive:true});

  // ── ZOOM med træk og dobbeltklik ──
  const zoom=document.getElementById('zoom');
  const flade=document.getElementById('zoom-flade');
  const zoomImg=document.getElementById('zoom-img');
  const zoomLuk=document.getElementById('zoom-luk');
  let zoomAaben=false;

  // Visningstilstand
  let scale=1, baseScale=1, tx=0, ty=0;
  let imgW=0, imgH=0;

  function anvend(){
    zoomImg.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
  }

  // Hold billedet inden for rimelige grænser, så det ikke forsvinder helt ud
  function begraens(){
    const vw=flade.clientWidth, vh=flade.clientHeight;
    const w=imgW*scale, h=imgH*scale;
    // Vandret
    if(w<=vw){ tx=(vw-w)/2; }
    else { tx=Math.min(0, Math.max(vw-w, tx)); }
    // Lodret — tillad at trække gennem hele sidens højde
    if(h<=vh){ ty=(vh-h)/2; }
    else { ty=Math.min(0, Math.max(vh-h, ty)); }
  }

  function aabnZoom(){
    zoomImg.src=PAGES[i];
    zoomImg.alt=labels[i];
    zoom.classList.add('aaben');
    zoomAaben=true;
    // vent på at billedet har mål
    if(zoomImg.complete && zoomImg.naturalWidth){ saetStart(); }
    else { zoomImg.onload=saetStart; }
  }
  function saetStart(){
    const vw=flade.clientWidth, vh=flade.clientHeight;
    const nw=zoomImg.naturalWidth, nh=zoomImg.naturalHeight;
    // Åbn i FULD BREDDE, så teksten bliver stor og læsbar.
    // (Siden er høj — man trækker/scroller bare nedad for at læse videre.)
    baseScale = vw/nw;
    imgW=nw; imgH=nh;
    scale=baseScale;
    tx=0;
    ty=0; // start i toppen
    anvend();
  }
  function lukZoom(){
    zoom.classList.remove('aaben');
    zoomAaben=false;
  }

  // Klik på siden i bogen åbner zoom
  bog.addEventListener('click',aabnZoom);
  zoomLuk.addEventListener('click',e=>{e.stopPropagation();lukZoom();});

  // DOBBELTKLIK = zoom ind på punktet (eller ud igen)
  flade.addEventListener('dblclick',e=>{
    const r=flade.getBoundingClientRect();
    const px=e.clientX-r.left, py=e.clientY-r.top;
    const zoometInd = scale > baseScale*1.4;
    const nyScale = zoometInd ? baseScale : baseScale*2.5;
    // hold punktet under musen fast
    const ratio=nyScale/scale;
    tx = px - (px-tx)*ratio;
    ty = py - (py-ty)*ratio;
    scale = nyScale;
    begraens(); anvend();
  });

  // TRÆK med mus
  let traekker=false, startX=0, startY=0, startTx=0, startTy=0;
  flade.addEventListener('mousedown',e=>{
    traekker=true; flade.classList.add('griber');
    startX=e.clientX; startY=e.clientY; startTx=tx; startTy=ty;
    e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(!traekker)return;
    tx=startTx+(e.clientX-startX);
    ty=startTy+(e.clientY-startY);
    begraens(); anvend();
  });
  window.addEventListener('mouseup',()=>{
    traekker=false; flade.classList.remove('griber');
  });

  // Musehjul = rul op/ned i siden (naturligt til læsning)
  flade.addEventListener('wheel',e=>{
    e.preventDefault();
    ty -= e.deltaY;
    begraens(); anvend();
  },{passive:false});

  // TOUCH: én finger = træk, to fingre = knib-zoom
  let tStartX=0,tStartY=0,tStartTx=0,tStartTy=0;
  let pinchStartDist=0, pinchStartScale=1, pinchMidX=0, pinchMidY=0;
  function dist(t){return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);}

  flade.addEventListener('touchstart',e=>{
    if(e.touches.length===1){
      tStartX=e.touches[0].clientX; tStartY=e.touches[0].clientY;
      tStartTx=tx; tStartTy=ty;
    } else if(e.touches.length===2){
      pinchStartDist=dist(e.touches);
      pinchStartScale=scale;
      const r=flade.getBoundingClientRect();
      pinchMidX=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left;
      pinchMidY=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
    }
  },{passive:false});
  flade.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches.length===1 && pinchStartDist===0){
      tx=tStartTx+(e.touches[0].clientX-tStartX);
      ty=tStartTy+(e.touches[0].clientY-tStartY);
      begraens(); anvend();
    } else if(e.touches.length===2){
      const d=dist(e.touches);
      const nyScale=Math.max(baseScale, Math.min(baseScale*5, pinchStartScale*(d/pinchStartDist)));
      const ratio=nyScale/scale;
      tx = pinchMidX - (pinchMidX-tx)*ratio;
      ty = pinchMidY - (pinchMidY-ty)*ratio;
      scale=nyScale;
      begraens(); anvend();
    }
  },{passive:false});
  flade.addEventListener('touchend',e=>{
    if(e.touches.length===0){ pinchStartDist=0; }
  });

  render();
})();
</script>
<script src="forside-knap.js" defer></script>
</body>
