name: Engangs-import af billeder fra Dropbox
on:
  push:
    branches: [foto-import-dropbox]
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install google-cloud-storage imagehash pillow
      - run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - run: python _foto_import/upload.py
        env:
          SA: ${{ runner.temp }}/sa.json
          DRY: ${{ contains(github.event.head_commit.message, '[dry]') && '1' || '0' }}
