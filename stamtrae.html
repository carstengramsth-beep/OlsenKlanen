try {
  const hent = n => sessionStorage.getItem(n) || localStorage.getItem(n) || "";

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gron:#2d5016;--gron-lys:#4a7c2a;--gron-pale:#c8e6b0;
  --guld:#c8952a;--guld-lys:#f5e6c8;--guld-pale:#fdf8ee;
  --tekst:#1a1a0e;--tekst-lys:#5a5a40;--border:#d4c9a0;--baggrund:#fffde0;
  --linje:#b9ad83;--lilla:#6b3a7e;
}
body{font-family:'Source Sans 3',sans-serif;background:var(--baggrund);color:var(--tekst);min-height:100vh;padding-bottom:5rem}
header{background:var(--gron);color:#fff;text-align:center;padding:1.6rem 1rem 1.8rem;border-bottom:3px solid var(--guld)}
header h1{font-family:'Playfair Display',serif;font-weight:500;font-size:2rem}
header p{margin-top:.3rem;color:var(--gron-pale)}
.styr{max-width:1100px;margin:1rem auto 0;padding:0 1rem;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.styr input{flex:1;min-width:220px;padding:.6rem .8rem;border:1.5px solid var(--border);border-radius:8px;font-size:15px;font-family:inherit;background:#fff}
.btn{font-family:inherit;font-size:14px;border:none;border-radius:8px;padding:.6rem 1rem;cursor:pointer;font-weight:600;background:#e8e2d0;color:var(--gron)}
.btn.gron{background:var(--gron);color:#fff}
.info{max-width:1100px;margin:.6rem auto 0;padding:0 1rem;font-size:14px;color:var(--tekst-lys)}
.forklaring{display:flex;gap:1.2rem;flex-wrap:wrap;margin-top:.4rem;font-size:12.5px}
.forklaring span{display:inline-flex;align-items:center;gap:.35rem}
.prik{width:14px;height:14px;border-radius:3px;display:inline-block;border:2px solid var(--gron)}
.prik.til{border-color:var(--guld);background:var(--guld-pale)}
.prik.bonus{border-style:dashed}
.lerred{overflow:auto;padding:1.5rem 1rem 3rem;margin-top:.5rem;cursor:grab}
.lerred.traek{cursor:grabbing}

/* Træets streger */
.trae{display:inline-block;min-width:100%;text-align:center}
.trae ul{padding-top:22px;position:relative;display:flex;justify-content:center}
.trae li{list-style:none;position:relative;padding:22px 8px 0;text-align:center;display:flex;flex-direction:column;align-items:center}
.trae li::before,.trae li::after{content:'';position:absolute;top:0;right:50%;border-top:2px solid var(--linje);width:50%;height:22px}
.trae li::after{right:auto;left:50%;border-left:2px solid var(--linje)}
.trae li:only-child::before,.trae li:only-child::after{display:none}
.trae li:only-child{padding-top:0}
.trae li:first-child::before,.trae li:last-child::after{border:0 none}
.trae li:last-child::before{border-right:2px solid var(--linje);border-radius:0 6px 0 0}
.trae li:first-child::after{border-radius:6px 0 0 0}
.trae ul ul::before{content:'';position:absolute;top:0;left:50%;border-left:2px solid var(--linje);width:0;height:22px}
.trae > ul{padding-top:0}
.trae li.bonus > .enhed{outline:2px dashed var(--linje);outline-offset:4px;border-radius:12px}
.bonus-maerke{font-size:10.5px;color:var(--tekst-lys);margin-bottom:2px}

.enhed{display:inline-flex;align-items:center;gap:6px;position:relative}
.gift{font-size:15px;color:var(--guld)}
.person{width:118px;background:#fff;border:2px solid var(--gron);border-radius:10px;padding:6px 5px 7px;cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative}
.person:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.person.til{border-color:var(--guld);background:var(--guld-pale)}
.person.afdod{opacity:.85}
.person.afdod .navn::after{content:' 🕯️'}
.person.fremhaev{box-shadow:0 0 0 4px #f1c40f}
.person.mig{box-shadow:0 0 0 3px var(--lilla)}
.foto{width:54px;height:54px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 4px;background:var(--gron-pale);color:var(--gron);font-weight:700;font-size:18px;line-height:54px;text-align:center}
.navn{font-size:12.5px;font-weight:600;line-height:1.2;color:var(--tekst)}
.aar{font-size:11px;color:var(--tekst-lys);margin-top:2px}
.snr{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--gron);color:#fff;font-size:9.5px;padding:1px 6px;border-radius:8px;white-space:nowrap}
.person.til .snr{background:var(--guld)}
.mangler-prik{position:absolute;top:5px;right:5px;width:10px;height:10px;border-radius:50%;background:#d0312d;box-shadow:0 0 0 2px #fff}
.foto.uden{border:2px dashed #e08a2b;background:#fff7ee;color:#c46f12;position:relative;box-sizing:border-box;line-height:50px}
.foto.uden .kam{position:absolute;right:-6px;bottom:-4px;font-size:15px;line-height:1}
.panel .foto.uden{line-height:normal;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px}
.panel .foto.uden small{font-size:11px;font-weight:700;margin-top:4px}
.hjaelp{margin-top:.6rem;padding:.55rem .7rem;background:#fff7ee;border:1px dashed #e08a2b;border-radius:8px;font-size:13px}
.op-link{display:block;margin:5px auto 0;font-size:10.5px;font-weight:700;color:#8a5a00;background:#fff3c4;border:1px solid var(--guld);border-radius:10px;padding:2px 6px;cursor:pointer;line-height:1.25}
.op-link:hover{background:#ffe48a}
.mangler-felt{background:#fff1e0 !important;border-color:#e08a2b !important;box-shadow:0 0 0 1px #e08a2b}

/* Personkort */
.panel-baggrund{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:300;padding:1rem}
.panel{background:#fff;border-radius:12px;max-width:420px;width:100%;border-top:5px solid var(--gron);box-shadow:0 10px 40px rgba(0,0,0,.3);overflow:hidden}
.panel-krop{padding:1.2rem 1.3rem}
.panel h2{font-family:'Playfair Display',serif;font-weight:500;color:var(--gron);font-size:1.35rem;margin-bottom:.4rem}
.panel .linje{font-size:14px;margin:.25rem 0}
.panel .foto{width:120px;height:120px;line-height:120px;font-size:28px;float:right;margin:0 0 .5rem .8rem}
.panel-fod{display:flex;gap:.5rem;flex-wrap:wrap;padding:.8rem 1.3rem;background:var(--guld-pale);border-top:1px solid var(--border)}
.ret-gitter{display:grid;grid-template-columns:1fr 1fr;gap:.5rem .7rem}
.ret-gitter label,.ret-hel{display:block;font-size:12px;color:var(--tekst-lys)}
.ret-hel{margin-top:.5rem}
.ret-gitter input,.ret-gitter select,.ret-hel textarea,.ret-hel input{width:100%;margin-top:2px;padding:.4rem .5rem;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:14px;background:#fff}
.panel{max-height:92vh;overflow:auto}
.tom{text-align:center;padding:3rem 1rem;color:var(--tekst-lys);font-size:15px;line-height:1.6}
@media (max-width:600px){ header{padding-top:3.2rem !important} }
</style>

      <div style="font-size:12px;color:var(--tekst-lys);margin:.3rem 0 .5rem">Træet ændres ikke med det samme. Forslaget bliver gennemgået, før det lægges ind.</div>
      <button class="btn gron" id="forslag-send">Send forslag</button> <span id="forslag-status" style="font-size:13px;margin-left:.5rem"></span>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const app = initializeApp({
  apiKey: "AIzaSyDlydsBrJQswqtiqTLM4yXDQWHbAolMpZU",
  authDomain: "olsenklanen-familieside.firebaseapp.com",
  projectId: "olsenklanen-familieside",
  storageBucket: "olsenklanen-familieside.firebasestorage.app",
  messagingSenderId: "640843662410",
  appId: "1:640843662410:web:e749b77ec9271e75c4d2b3"
});
const db = getFirestore(app);
const storage = getStorage(app);
const erAdmin = (() => { try { return (sessionStorage.getItem("ok_niveau") || localStorage.getItem("ok_niveau") || "").trim().toLowerCase() === "admin"; } catch(e) { return false; } })();
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hent = n => { try { return (sessionStorage.getItem(n) || localStorage.getItem(n) || "").trim(); } catch(e) { return ""; } };

// ── Data ──
const P = new Map();          // pid → { p, nr, husNavn, kilde }
let stamPids = [];            // Agnes og Svend Aage (husstand 1)

function navnAf(p) { return [p.fornavn, p.mellemnavn, p.efternavn].filter(x => x && String(x).trim()).join(" ").trim() || (p.navn || "").trim(); }
function personNr(rec) {
  const p = rec.p;
  if (p.fastNr) return String(p.fastNr);
  if (rec.kilde === "slaegt") return "";
  if (p.bogstav && p.status !== "udmeldt") return rec.nr + "-" + p.bogstav;
  return rec.nr;
}
function aarTekst(p) {
  const f = (p.foedselsdato || "").slice(0, 4), d = p.status === "afdød" ? (p.status_dato || "").slice(0, 4) : "";
  if (f && d) return `${f} – ${d}`;
  if (f) return `f. ${f}`;
  if (d) return `d. ${d}`;
  return "";
}
function datoTekst(iso) {
  if (!iso) return "";
  const [a, m, d] = iso.split("-");
  const mdr = ["januar","februar","marts","april","maj","juni","juli","august","september","oktober","november","december"];
  return d && m ? `${+d}. ${mdr[+m - 1]} ${a}` : iso;
}

async function hentData() {
  const snap = await getDocs(collection(db, "membres"));
  snap.forEach(d => {
    const h = d.data(); const nr = String(h.nr || d.id);
    const husNavn = (h.familiemedlemmer || []).map(x => (x.fornavn || navnAf(x).split(" ")[0])).filter(Boolean).join(" & ");
    (h.familiemedlemmer || []).forEach(p => { if (p.pid && navnAf(p)) P.set(p.pid, { p, nr, husNavn, kilde: "kartotek" }); });
    if (nr === "1") stamPids = (h.familiemedlemmer || []).map(p => p.pid).filter(Boolean);
  });
  // Slægten: personer, der aldrig har været medlemmer (kommer senere – læses allerede her, hvis de findes)
  try {
    const { query, where } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const s2 = await getDocs(query(collection(db, "olsenpost"), where("type", "==", "slaegt")));
    s2.forEach(d => { const p = d.data(); if (p.pid && navnAf(p)) P.set(p.pid, { p, nr: "", husNavn: "Slægten", kilde: "slaegt" }); });
  } catch(e) {}
}

// ── Relationer ──
function boernAf(pids) {
  const s = new Set(pids), bio = [], bonus = [];
  for (const [pid, r] of P) {
    if (s.has(r.p.far_pid) || s.has(r.p.mor_pid)) bio.push(pid);
    else if (s.has(r.p.bonus1_pid) || s.has(r.p.bonus2_pid)) bonus.push(pid);
  }
  const sorter = a => a.sort((x, y) => String(P.get(x).p.foedselsdato || "9999").localeCompare(String(P.get(y).p.foedselsdato || "9999")));
  return { bio: sorter(bio), bonus: sorter(bonus) };
}
function partnerAf(pid) {
  const r = P.get(pid); if (!r) return null;
  if (r.p.partner_pid && P.has(r.p.partner_pid)) return r.p.partner_pid;
  for (const [x, o] of P) if (o.p.partner_pid === pid) return x;
  return null;
}

// ── Slægtsnummer: Agnes og Svend Aage = 1; født efter dem 2, 3 …; født før −1, −2 … ──
const SNR = new Map(); let SNR_ANTAL = 0;
function beregnSlaegtsnumre() {
  // Alle, der hænger sammen med Agnes og Svend Aage
  const nab = new Map();
  const forbind = (a, b) => { if (!a || !b || !P.has(a) || !P.has(b)) return; (nab.get(a) || nab.set(a, new Set()).get(a)).add(b); (nab.get(b) || nab.set(b, new Set()).get(b)).add(a); };
  for (const [pid, r] of P) ["far_pid","mor_pid","bonus1_pid","bonus2_pid","partner_pid"].forEach(f => forbind(pid, r.p[f]));
  const set = new Set(stamPids), koe = [...stamPids];
  while (koe.length) { const x = koe.pop(); (nab.get(x) || []).forEach(y => { if (!set.has(y)) { set.add(y); koe.push(y); } }); }
  SNR_ANTAL = set.size;
  const stamDato = stamPids.map(p => P.get(p)?.p.foedselsdato).filter(Boolean).sort();
  const foerst = stamDato[0] || "1900-01-01", sidst = stamDato[stamDato.length - 1] || foerst;
  const andre = [...set].filter(p => !stamPids.includes(p));
  const dato = p => P.get(p).p.foedselsdato || "";
  const efter = andre.filter(p => dato(p) && dato(p) > sidst).sort((a, b) => dato(a).localeCompare(dato(b)));
  const foer = andre.filter(p => dato(p) && dato(p) < foerst).sort((a, b) => dato(b).localeCompare(dato(a)));
  const ukendt = andre.filter(p => !dato(p) || (dato(p) >= foerst && dato(p) <= sidst));
  stamPids.forEach(p => SNR.set(p, 1));
  [...efter, ...ukendt].forEach((p, i) => SNR.set(p, i + 2));
  foer.forEach((p, i) => SNR.set(p, -(i + 1)));
}

// ── Tegn træet ──
let mitPid = null;
// Hvad mangler vi at vide om personen? (rød prik i træet)
function manglerFor(p) {
  const m = [];
  if (!p.foedselsdato) m.push("født");
  if (p.status === "afdød" && !p.status_dato) m.push("død");
  if (!p.foto) m.push("billede");
  if (!p.far_pid && !p.mor_pid) m.push("forældre");
  if (p.status === "afdød" && !String(p.mindeord || p.fortaelling || "").trim()) m.push("mindeord/fortælling");
  if (p.status === "afdød" && !(p.bekraeftet && p.bekraeftet.navn)) m.push("bekræftelse af data");
  return m;
}
function personKort(pid, tilloeben) {
  const r = P.get(pid); const p = r.p; const navn = navnAf(p);
  const initialer = navn.split(/\s+/).map(x => x[0]).slice(0, 2).join("").toUpperCase();
  const snr = SNR.has(pid) ? `<span class="snr">${SNR.get(pid)} / ${SNR_ANTAL}</span>` : "";
  return `<div class="person${tilloeben ? " til" : ""}${p.status === "afdød" ? " afdod" : ""}${pid === mitPid ? " mig" : ""}" data-pid="${pid}" title="${esc(navn)}">
    ${snr}${manglerFor(p).length ? `<span class="mangler-prik" title="Mangler: ${esc(manglerFor(p).join(", "))}"></span>` : ""}${p.foto ? `<img class="foto" src="${esc(p.foto)}" alt="">` : `<div class="foto uden" title="Billede mangler">${esc(initialer)}<span class="kam">📷</span></div>`}
    <div class="navn">${esc(navn)}</div><div class="aar">${esc(aarTekst(p))}</div>${tilloeben ? foraeldreLink(p, pid) : ""}</div>`;
}
// Tilløbne: vis et link op til deres egne forældre (fx svigerforældre)
function foraeldreLink(p, pid) {
  const far = P.has(p.far_pid) ? p.far_pid : "", mor = P.has(p.mor_pid) ? p.mor_pid : "";
  if (!far && !mor) return "";
  const fn = x => (P.get(x).p.fornavn || navnAf(P.get(x).p).split(" ")[0]);
  const navne = [far, mor].filter(Boolean).map(fn).join(" & ");
  return `<span class="op-link" data-op="${esc(far || mor)}" data-fra="${esc(pid)}" title="Vis ${esc(p.fornavn || "")}s forældre og familie">⬆ ${esc(navne)}</span>`;
}
function tegnEnhed(pids, besoegt, erBonus, erRod) {
  // En "enhed" = en person (eller et par) + deres børn
  pids = pids.filter(p => P.has(p) && !besoegt.has(p));
  if (!pids.length) return "";
  if (pids.length === 1) { const pa = partnerAf(pids[0]); if (pa && !besoegt.has(pa)) pids.push(pa); }
  pids.forEach(p => besoegt.add(p));
  // Den første er slægt; en partner, der ikke selv er barn i træet, er "tilløben"
  const kort = pids.map((p, i) => personKort(p, i > 0 && !(erRod && stamPids.includes(p)))).join('<span class="gift">⚭</span>');
  const { bio, bonus } = boernAf(pids);
  const born = [
    ...bio.filter(b => !besoegt.has(b)).map(b => ({ b, bonus: false })),
    ...bonus.filter(b => !besoegt.has(b) && !bio.includes(b)).map(b => ({ b, bonus: true }))
  ];
  const under = born.map(x => tegnEnhed([x.b], besoegt, x.bonus, false)).filter(Boolean);
  return `<li class="${erBonus ? "bonus" : ""}">${erBonus ? '<div class="bonus-maerke">bonusbarn</div>' : ""}<div class="enhed">${kort}</div>${under.length ? `<ul>${under.join("")}</ul>` : ""}</li>`;
}
function tegnTrae(topPids) {
  const besoegt = new Set();
  const html = tegnEnhed(topPids, besoegt, false, true);
  const antal = besoegt.size;
  if (!html) { $("trae").innerHTML = '<div class="tom">Personen blev ikke fundet.</div>'; return; }
  $("trae").innerHTML = `<ul>${html}</ul>`;
  const navne = topPids.filter(p => P.has(p)).map(p => navnAf(P.get(p).p).split(" ")[0]).join(" og ");
  $("status").innerHTML = `Træet viser <b>${antal}</b> ${antal === 1 ? "person" : "personer"} fra <b>${esc(navne)}</b> og nedad. `
    + `Hele slægtstræet har lige nu <b>${SNR_ANTAL}</b> personer, der hænger sammen med Agnes og Svend Aage.`
    + (antal <= 2 ? `<br><span style="color:#a33">Der er endnu ikke skrevet børn ind under denne person. Relationer skrives ind i <a href="medlemskartotek.html">Medlemskartoteket</a> under ✏️ Rediger (far, mor, partner).</span>` : "");
  // Centrér vandret
  const l = $("lerred"); l.scrollLeft = Math.max(0, ($("trae").scrollWidth - l.clientWidth) / 2);
}

// ── Personkort (panel) ──
let panelPid = null;
function visPanel(pid) {
  const r = P.get(pid); if (!r) return; const p = r.p; panelPid = pid;
  const navn = navnAf(p);
  const rel = pidX => P.has(pidX) ? esc(navnAf(P.get(pidX).p)) : "";
  const { bio, bonus } = boernAf([pid]);
  const pa = partnerAf(pid);
  const linjer = [
    p.tidligere_navne ? `📝 Tidligere navne: ${esc(p.tidligere_navne)}` : "",
    p.foedselsdato ? `🎂 Født ${datoTekst(p.foedselsdato)}` : "",
    p.status === "afdød" ? `🕯️ Død ${datoTekst(p.status_dato) || ""}` : "",
    personNr(r) ? `📇 Medlemsnr. ${esc(personNr(r))}${r.husNavn ? " · " + esc(r.husNavn) : ""}` : (r.kilde === "slaegt" ? "🌿 I Slægten (ikke medlem)" : ""),
    SNR.has(pid) ? `🌳 Slægtsnr. ${SNR.get(pid)} / ${SNR_ANTAL}` : "",
    p.far_pid ? `Far: ${rel(p.far_pid)}` : "", p.mor_pid ? `Mor: ${rel(p.mor_pid)}` : "",
    [p.bonus1_pid, p.bonus2_pid].filter(Boolean).map(b => `Bonusforælder: ${rel(b)}`).join("<br>"),
    pa ? `Partner: ${rel(pa)}` : "",
    (() => { const s = [...P.keys()].filter(x => x !== pid && ((p.far_pid && P.get(x).p.far_pid === p.far_pid) || (p.mor_pid && P.get(x).p.mor_pid === p.mor_pid)));
      return s.length ? `Søskende: ${s.map(rel).join(", ")}` : ""; })(),
    bio.length ? `Børn: ${bio.map(rel).join(", ")}` : "",
    bonus.length ? `Bonusbørn: ${bonus.map(rel).join(", ")}` : "",
    p.fortaelling ? `<div style="margin-top:.6rem;white-space:pre-line">${esc(p.fortaelling)}</div>` : "",
    p.bekraeftet && p.bekraeftet.navn ? `✅ Data bekræftet af ${esc(p.bekraeftet.navn)} (${esc(datoTekst(p.bekraeftet.dato))})` : "",
    manglerFor(p).length ? `<div style="margin-top:.5rem;color:#d0312d;font-size:13px">🔴 Mangler: ${esc(manglerFor(p).join(", "))}</div><div class="hjaelp">🙏 <b>Hjælp med at gøre ${esc((p.fornavn || navn).split(" ")[0])} færdig.</b> Har du et billede eller kender du datoerne? Så tryk på en af <b>✏️-knapperne</b> herunder – eller send det til 5-Banden.</div>` : ""
  ].filter(Boolean);
  const initialer = navn.split(/\s+/).map(x => x[0]).slice(0, 2).join("").toUpperCase();
  $("panel-krop").innerHTML = `${p.foto ? `<img class="foto" src="${esc(p.foto)}" alt="" data-stort="${esc(navnAf(p))}" title="Tryk for at se billedet stort">` : `<div class="foto uden">📷<small>Billede mangler</small></div>`}
    <h2>${esc(navn)}</h2>${linjer.map(l => `<div class="linje">${l}</div>`).join("")}<div style="clear:both"></div>`;
  $("p-personkort").href = "person.html?pid=" + encodeURIComponent(pid);
  $("p-kort").style.display = r.kilde === "kartotek" ? "" : "none";
  $("p-ret").style.display = erAdmin ? "" : "none";
  $("p-ret").textContent = r.kilde === "kartotek" ? "✏️ Ret i kartoteket" : "✏️ Ret data";
  $("ret-boks").style.display = "none";
  $("p-kort").href = "medlemskartotek.html";
  $("forslag-boks").style.display = "none";
  $("panel-bg").style.display = "flex";
}
$("p-luk").onclick = () => $("panel-bg").style.display = "none";
$("p-ret").onclick = () => {
  const r = P.get(panelPid);
  if (r.kilde === "kartotek") { location.href = "medlemskartotek.html?rediger=" + encodeURIComponent(r.nr); return; }
  if (r.p.status === "afdød") { location.href = "medlemskartotek.html?ret_afdod=" + encodeURIComponent(panelPid); return; }
  const p = r.p;
  $("r-fornavn").value = p.fornavn || ""; $("r-mellemnavn").value = p.mellemnavn || ""; $("r-efternavn").value = p.efternavn || "";
  $("r-foedt").value = p.foedselsdato || ""; $("r-status").value = p.status === "afdød" ? "afdød" : "";
  $("r-doed").value = p.status_dato || ""; $("r-fortaelling").value = p.fortaelling || ""; $("r-foto").value = "";
  $("r-status-tekst").textContent = "";
  $("forslag-boks").style.display = "none";
  $("ret-boks").style.display = "block";
  ["r-foedt", "r-fortaelling"].forEach(id => $(id).classList.toggle("mangler-felt", !$(id).value.trim()));
  $("r-foto").classList.toggle("mangler-felt", !p.foto);
  $("ret-boks").scrollIntoView({ behavior: "smooth", block: "nearest" });
};
$("r-annuller").onclick = () => $("ret-boks").style.display = "none";
// Gør billedet mindre (maks. 800 px) før det lægges op
function formindsk(fil) {
  return new Promise((ok, fejl) => {
    const img = new Image(); const url = URL.createObjectURL(fil);
    img.onload = () => {
      const m = 800, f = Math.min(1, m / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * f); c.height = Math.round(img.height * f);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? ok(b) : fejl(new Error("Kunne ikke læse billedet")); }, "image/jpeg", 0.85);
    };
    img.onerror = () => fejl(new Error("Kunne ikke læse billedet"));
    img.src = url;
  });
}
$("r-gem").onclick = async () => {
  const r = P.get(panelPid); const p = r.p;
  const nyt = {
    fornavn: $("r-fornavn").value.trim(), mellemnavn: $("r-mellemnavn").value.trim(), efternavn: $("r-efternavn").value.trim(),
    foedselsdato: $("r-foedt").value, status: $("r-status").value, status_dato: $("r-status").value === "afdød" ? $("r-doed").value : "",
    fortaelling: $("r-fortaelling").value.trim(), sidst_rettet: new Date().toISOString(), sidst_rettet_af: hent("ok_nr")
  };
  if (!nyt.fornavn) { $("r-status-tekst").textContent = "Fornavn mangler."; return; }
  nyt.navn = [nyt.fornavn, nyt.mellemnavn, nyt.efternavn].filter(Boolean).join(" ");
  $("r-gem").disabled = true; $("r-status-tekst").textContent = "Gemmer …";
  try {
    const fil = $("r-foto").files[0];
    if (fil) {
      $("r-status-tekst").textContent = "Lægger billedet op …";
      const blob = await formindsk(fil);
      const sti = sRef(storage, `gamle_billeder/slaegt/${panelPid}_${Date.now()}.jpg`);
      await uploadBytes(sti, blob, { contentType: "image/jpeg" });
      nyt.foto = await getDownloadURL(sti);
    }
    await updateDoc(doc(db, "olsenpost", "slaegt_" + panelPid), nyt);
    Object.assign(p, nyt);
    beregnSlaegtsnumre();
    const top = new URL(location.href).searchParams.get("top");
    tegnTrae(top && P.has(top) ? [top] : stamPids);
    visPanel(panelPid);
    $("r-status-tekst").textContent = "";
  } catch(e) {
    $("r-status-tekst").textContent = "Kunne ikke gemme: " + (e.message || e);
  }
  $("r-gem").disabled = false;
};
$("p-forslag").onclick = () => {
  $("ret-boks").style.display = "none";
  $("forslag-boks").style.display = "block";
  $("forslag-navn").textContent = navnAf(P.get(panelPid).p);
  $("forslag-status").textContent = ""; $("forslag-tekst").focus();
};
$("forslag-send").onclick = async () => {
  const tekst = $("forslag-tekst").value.trim();
  if (tekst.length < 3) { $("forslag-status").textContent = "Skriv dit forslag først."; return; }
  $("forslag-send").disabled = true; $("forslag-status").textContent = "Sender …";
  try {
    await addDoc(collection(db, "olsenpost"), {
      type: "slaegt_forslag", til: [], status: "ny",
      pid: panelPid, person: navnAf(P.get(panelPid).p), tekst,
      afsender: hent("ok_nr"), afsender_navn: hent("ok_navn"), tid: new Date().toISOString()
    });
    $("forslag-status").textContent = "✅ Tak! Dit forslag er modtaget.";
    $("forslag-tekst").value = "";
  } catch(e) { $("forslag-status").textContent = "Kunne ikke sende: " + (e.message || e); }
  $("forslag-send").disabled = false;
};
$("panel-bg").addEventListener("click", e => { if (e.target.id === "panel-bg") $("panel-bg").style.display = "none"; });
$("p-herfra").onclick = () => { $("panel-bg").style.display = "none"; visFra([panelPid]); };
$("trae").addEventListener("click", e => {
  const op = e.target.closest(".op-link");
  if (op) { visFra([op.dataset.op]); setTimeout(() => { const k = document.querySelector(`.person[data-pid="${op.dataset.fra}"]`); if (k) { k.classList.add("fremhaev"); k.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" }); } }, 50); return; }
  const k = e.target.closest(".person"); if (k) visPanel(k.dataset.pid);
});

// ── Valg af top ──
function etiket(pid) { const r = P.get(pid); const nr = personNr(r); const f = (r.p.foedselsdato || "").slice(0, 4); return `${nr ? nr + " · " : ""}${navnAf(r.p)}${f ? " (f. " + f + ")" : ""}`; }
function findPid(t) {
  t = String(t || "").trim().toLowerCase(); if (!t) return null;
  for (const pid of P.keys()) if (etiket(pid).toLowerCase() === t) return pid;
  const nr = [...P.keys()].filter(pid => etiket(pid).toLowerCase().startsWith(t + " ·"));
  if (nr.length === 1) return nr[0];
  const n = [...P.keys()].filter(pid => etiket(pid).toLowerCase().includes(t));
  return n.length ? n[0] : null;
}
function visFra(pids) {
  const url = new URL(location.href);
  if (pids.length === 1) url.searchParams.set("top", pids[0]); else url.searchParams.delete("top");
  history.replaceState(null, "", url);
  tegnTrae(pids);
}
$("vis-herfra").onclick = () => { const pid = findPid($("find").value); if (pid) visFra([pid]); else $("status").textContent = "Personen blev ikke fundet. Vælg fra listen."; };
$("find").addEventListener("keydown", e => { if (e.key === "Enter") $("vis-herfra").click(); });
$("hele").onclick = () => visFra(stamPids);
$("mit").onclick = () => {
  if (!mitPid) { $("status").textContent = "Vi kunne ikke finde dig i kartoteket. Brug søgefeltet i stedet."; return; }
  const r = P.get(mitPid).p;
  // Start ved forældrene, hvis de er skrevet ind – ellers ved én selv
  const top = r.far_pid && P.has(r.far_pid) ? r.far_pid : (r.mor_pid && P.has(r.mor_pid) ? r.mor_pid : mitPid);
  visFra([top]);
  setTimeout(() => { const k = document.querySelector(`.person[data-pid="${mitPid}"]`); if (k) k.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" }); }, 50);
};

// Træk for at flytte rundt i et stort træ
(() => {
  const l = $("lerred"); let ned = false, x = 0, y = 0, sl = 0, st = 0;
  l.addEventListener("mousedown", e => { if (e.target.closest(".person")) return; ned = true; l.classList.add("traek"); x = e.pageX; y = e.pageY; sl = l.scrollLeft; st = window.scrollY; });
  window.addEventListener("mouseup", () => { ned = false; l.classList.remove("traek"); });
  window.addEventListener("mousemove", e => { if (!ned) return; l.scrollLeft = sl - (e.pageX - x); window.scrollTo(0, st - (e.pageY - y)); });
})();

// ── Start ──
try {
  await hentData();
  beregnSlaegtsnumre();
  // Hvem er jeg? (ok_nr fx "8-B")
  const mig = hent("ok_nr").toUpperCase();
  if (mig) for (const [pid, r] of P) if (r.kilde === "kartotek" && String(personNr(r)).toUpperCase() === mig) { mitPid = pid; break; }
  $("alle-personer").innerHTML = [...P.keys()].map(etiket).sort((a, b) => a.localeCompare(b, "da", { numeric: true })).map(t => `<option value="${esc(t)}"></option>`).join("");
  const top = new URL(location.href).searchParams.get("top");
  visFra(top && P.has(top) ? [top] : stamPids);
} catch(err) {
  $("status").textContent = "Kunne ikke hente data: " + (err.message || err);
}
</script>
