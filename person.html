<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Personkort – OlsenKlanen</title>
<script>
// Kun for medlemmer
try {
  const hent = n => sessionStorage.getItem(n) || localStorage.getItem(n) || "";
  if (!(hent("ok_niveau") || hent("ok_navn") || hent("ok_nr"))) window.location.href = "login.html?videre=stamtrae.html";
} catch(e) {}
</script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gron:#2d5016;--gron-lys:#4a7c2a;--gron-pale:#c8e6b0;--guld:#c8952a;--guld-lys:#f5e6c8;--guld-pale:#fdf8ee;--tekst:#1a1a0e;--tekst-lys:#5a5a40;--border:#d4c9a0;--baggrund:#fffde0;--roed:#d0312d}
body{font-family:'Source Sans 3',sans-serif;background:var(--baggrund);color:var(--tekst);min-height:100vh;padding-bottom:5rem;font-size:16px;line-height:1.5}
header{background:var(--gron);color:#fff;text-align:center;padding:1.4rem 1rem 1.6rem;border-bottom:3px solid var(--guld);position:relative}
header h1{font-family:'Playfair Display',serif;font-weight:500;font-size:1.8rem}
header p{color:var(--gron-pale)}
.top-forside{position:absolute;left:16px;top:14px;color:#f5e6c8;text-decoration:none;border:1px solid #f5e6c8;padding:6px 12px;border-radius:6px;font-size:14px}
@media (max-width:600px){header{padding-top:3.2rem}}
main{max-width:900px;margin:0 auto;padding:1.2rem 1rem}
.kort{background:#fff;border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.3rem;margin-bottom:1rem}
.kort h2{font-family:'Playfair Display',serif;font-weight:500;color:var(--gron);font-size:1.25rem;margin-bottom:.6rem}
.hoved{display:flex;gap:1.2rem;align-items:flex-start;flex-wrap:wrap}
.foto{width:130px;height:130px;border-radius:12px;object-fit:cover;background:var(--gron-pale);color:var(--gron);font-size:40px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.navn{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--gron);line-height:1.2}
.linje{margin:.15rem 0}
.foto.uden{border:2px dashed #e08a2b;background:#fff7ee;color:#c46f12;flex-direction:column;font-size:36px}
.foto.uden small{font-size:12px;font-weight:700;margin-top:4px}
.hjaelp{margin-top:.5rem;padding:.55rem .7rem;background:#fff7ee;border:1px dashed #e08a2b;border-radius:8px;font-size:14px}
.mangler{color:var(--roed);font-size:14px;margin-top:.4rem}
.ok{color:var(--gron);font-size:14px;margin-top:.4rem}
.knapper{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
.btn{font-family:inherit;font-size:14px;border:none;border-radius:8px;padding:.55rem 1rem;cursor:pointer;font-weight:600;background:#e8e2d0;color:var(--gron);text-decoration:none;display:inline-block}
.btn.gron{background:var(--gron);color:#fff}
.felt-titel{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--tekst-lys);margin-top:.7rem}
.tekst{white-space:pre-line}
.grav-foto{max-width:220px;border-radius:8px;margin-top:.4rem}
.gen{margin:.3rem 0 .9rem}
.gen-titel{font-weight:600;color:var(--gron);margin-bottom:.3rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;background:var(--guld-pale);border:1px solid var(--border);border-radius:20px;padding:.25rem .7rem .25rem .3rem;text-decoration:none;color:var(--tekst);font-size:14px}
.chip:hover{background:var(--guld-lys)}
.chip img,.chip .ini{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--gron-pale);color:var(--gron);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.chip .prik{width:8px;height:8px;border-radius:50%;background:var(--roed)}
.tom{color:var(--tekst-lys);font-size:14px;font-style:italic}
.rel-rad{display:grid;grid-template-columns:170px 1fr auto;gap:.6rem;align-items:center;padding:.55rem 0;border-bottom:1px solid #eee5cc}
.rel-titel{font-weight:600;color:var(--gron)}
.rel-under{font-weight:400;font-size:13px;color:var(--tekst-lys)}
.rel-knapper{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}
.btn.lille{padding:.3rem .7rem;font-size:13px}
.rel-editor{margin-top:.8rem;background:var(--guld-pale);border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem}
.forslag-boks{background:#eef6e6;border:1px solid var(--gron-pale);border-radius:10px;padding:.6rem .9rem;margin-bottom:.6rem}
.forslag{margin:.3rem 0;font-size:15px}
.hjaelp{font-size:13px;color:var(--tekst-lys);margin-bottom:.5rem}
.flere{margin-top:.5rem}.flere summary{cursor:pointer;color:var(--tekst-lys);font-size:14px;padding:.3rem 0}
h3.sek{font-size:14px;color:var(--tekst-lys);margin:.8rem 0 .2rem;font-weight:600}
@media (max-width:640px){.rel-rad{grid-template-columns:1fr}.rel-knapper{justify-content:flex-start}}
.form-gitter{display:grid;grid-template-columns:1fr 1fr;gap:.5rem .8rem}
.form-gitter label,.hel{display:block;font-size:13px;color:var(--tekst-lys)}
.hel{margin-top:.5rem}
.form-gitter input,.form-gitter select,.hel textarea{width:100%;margin-top:2px;padding:.45rem .55rem;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:15px;background:#fff}
@media (max-width:600px){.form-gitter{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <a href="forside.html" class="top-forside">🏠 Forsiden</a>
  <h1>👤 Personkort</h1>
  <p>Alle data og hele familien – op og ned</p>
</header>
<main id="main"><div class="kort">Henter …</div></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, getDoc, setDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const app = initializeApp({ apiKey: "AIzaSyDlydsBrJQswqtiqTLM4yXDQWHbAolMpZU", authDomain: "olsenklanen-familieside.firebaseapp.com", projectId: "olsenklanen-familieside", storageBucket: "olsenklanen-familieside.firebasestorage.app", messagingSenderId: "640843662410", appId: "1:640843662410:web:e749b77ec9271e75c4d2b3" });
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hent = n => { try { return (sessionStorage.getItem(n) || localStorage.getItem(n) || "").trim(); } catch(e) { return ""; } };
const ER_ADMIN = hent("ok_niveau").toLowerCase() === "admin";

const P = new Map();   // pid → { p, nr, kilde, husNavn }
const navnAf = p => [p.fornavn, p.mellemnavn, p.efternavn].filter(x => x && String(x).trim()).join(" ").trim() || (p.navn || "").trim();
const mdr = ["januar","februar","marts","april","maj","juni","juli","august","september","oktober","november","december"];
const dato = iso => { const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${+m[3]}. ${mdr[+m[2] - 1]} ${m[1]}` : ""; };
const ini = n => n.split(/\s+/).map(x => x[0]).slice(0, 2).join("").toUpperCase();
function personNr(r) { const p = r.p; if (p.fastNr) return String(p.fastNr); if (r.kilde !== "kartotek") return ""; return p.bogstav && p.status !== "udmeldt" ? r.nr + "-" + p.bogstav : r.nr; }
function manglerFor(p) {
  const m = [];
  if (!p.foedselsdato) m.push("født");
  if (p.status === "afdød" && !p.status_dato) m.push("død");
  if (!p.foto) m.push("billede");
  if (!p.far_pid && !p.mor_pid) m.push("forældre");
  if (p.status === "afdød" && !String(p.mindeord || p.fortaelling || "").trim()) m.push("mindeord/fortælling");
  if (p.status === "afdød" && !(p.bekraeftet && p.bekraeftet.navn)) m.push("bekræftelse af data");
  return m;
}

async function hentData() {
  P.clear();
  const snap = await getDocs(collection(db, "membres"));
  snap.forEach(d => { const h = d.data(); const nr = String(h.nr || d.id);
    const husNavn = (h.familiemedlemmer || []).map(x => x.fornavn || navnAf(x).split(" ")[0]).filter(Boolean).join(" & ");
    (h.familiemedlemmer || []).forEach(p => { if (p.pid && navnAf(p)) P.set(p.pid, { p, nr, kilde: "kartotek", husNavn }); }); });
  try {
    const s2 = await getDocs(query(collection(db, "olsenpost"), where("type", "==", "slaegt")));
    s2.forEach(d => { const p = d.data(); if (p.pid && navnAf(p)) P.set(p.pid, { p, nr: "", kilde: "slaegt", husNavn: "Slægten" }); });
  } catch(e) {}
}

// ── Relationer ──
const foraeldre = pid => { const p = P.get(pid)?.p; return p ? [p.far_pid, p.mor_pid].filter(x => x && P.has(x)) : []; };
const bonusForaeldre = pid => { const p = P.get(pid)?.p; return p ? [p.bonus1_pid, p.bonus2_pid].filter(x => x && P.has(x)) : []; };
const boern = pid => [...P.keys()].filter(x => { const q = P.get(x).p; return q.far_pid === pid || q.mor_pid === pid; });
const bonusBoern = pid => [...P.keys()].filter(x => { const q = P.get(x).p; return q.bonus1_pid === pid || q.bonus2_pid === pid; });
// Tidligere ægtefæller/partnere – gemmes som liste på den ene af de to; læses begge veje
function tidligere(pid) {
  const ud = [], set = new Set();
  const p = P.get(pid)?.p; if (!p) return ud;
  (p.tidligere_partnere || []).forEach(t => { if (t && t.pid && P.has(t.pid) && !set.has(t.pid)) { set.add(t.pid); ud.push({ ...t, ejer: pid }); } });
  for (const [x, r] of P) (r.p.tidligere_partnere || []).forEach(t => { if (t && t.pid === pid && !set.has(x)) { set.add(x); ud.push({ ...t, pid: x, ejer: x }); } });
  return ud;
}
function tidlTekst(t) {
  const f = { gift: "⚭ Gift", samlever: "Samlevende", kaereste: "Kærester" }[t.type] || "";
  const slut = { skilt: "skilt", død: "død", slut: "gået fra hinanden" }[t.slut] || "";
  return [f && (f + (t.fra ? " " + esc(t.fra) : "")), slut && (slut + (t.til ? " " + esc(t.til) : ""))].filter(Boolean).join(" · ");
}
function partner(pid) { const p = P.get(pid)?.p; if (p?.partner_pid && P.has(p.partner_pid)) return p.partner_pid; for (const [x, r] of P) if (r.p.partner_pid === pid) return x; return null; }
function soeskende(pid) { const p = P.get(pid)?.p; if (!p) return []; return [...P.keys()].filter(x => x !== pid && ((p.far_pid && P.get(x).p.far_pid === p.far_pid) || (p.mor_pid && P.get(x).p.mor_pid === p.mor_pid))); }
const unik = a => [...new Set(a)];
const sorterAlder = a => a.sort((x, y) => String(P.get(x).p.foedselsdato || "9999").localeCompare(String(P.get(y).p.foedselsdato || "9999")));

function chip(pid) {
  const r = P.get(pid); if (!r) return ""; const p = r.p; const n = navnAf(p);
  const f = (p.foedselsdato || "").slice(0, 4), d = p.status === "afdød" ? (p.status_dato || "").slice(0, 4) : "";
  const aar = f || d ? ` <span style="color:var(--tekst-lys)">${f}${d ? "–" + d : ""}</span>` : "";
  return `<a class="chip" href="person.html?pid=${encodeURIComponent(pid)}">${p.foto ? `<img src="${esc(p.foto)}" alt="">` : `<span class="ini">${esc(ini(n))}</span>`}${esc(n)}${p.status === "afdød" ? " 🕯️" : ""}${aar}${manglerFor(p).length ? '<span class="prik" title="Mangler data"></span>' : ""}</a>`;
}
function gen(titel, pids) {
  pids = sorterAlder(unik(pids));
  return `<div class="gen"><div class="gen-titel">${titel}</div>${pids.length ? `<div class="chips">${pids.map(chip).join("")}</div>` : '<div class="tom">Ingen registreret endnu</div>'}</div>`;
}

// Hvem må rette? Administratorer – og medlemmer for personer i deres egen husstand
const MIT_HUS = hent("ok_nr").split("-")[0];
function kanRette(pid) { const r = P.get(pid); if (!r) return false; return ER_ADMIN || (r.kilde === "kartotek" && MIT_HUS && r.nr === MIT_HUS); }
const fornavn = pid => navnAf(P.get(pid).p).split(" ")[0];
const VOKSEN = new Set(["forælder", "ægtefælle", "ægtefælle / partner", "partner", "samlever"]);

function relRad(titel, pids, knapper) {
  return `<div class="rel-rad"><div class="rel-titel">${titel}</div><div class="rel-indhold">${pids.length ? `<div class="chips">${pids.map(chip).join("")}</div>` : '<span class="tom">Ikke valgt</span>'}</div><div class="rel-knapper">${knapper}</div></div>`;
}

function vis(pid, aabenRel) {
  const r = P.get(pid);
  if (!r) { $("main").innerHTML = '<div class="kort">Personen blev ikke fundet. <a href="stamtrae.html">Gå til stamtræet</a></div>'; return; }
  const p = r.p, n = navnAf(p), fn = n.split(" ")[0], ret = kanRette(pid);
  document.title = n + " – Personkort";
  const far = foraeldre(pid);
  const bedste = unik(far.flatMap(foraeldre));
  const olde = unik(bedste.flatMap(foraeldre));
  const b = boern(pid), bb = unik(b.flatMap(boern)), obb = unik(bb.flatMap(boern));
  const pa = partner(pid), mgl = manglerFor(p);
  const pp = pa ? P.get(pa).p : null;
  const bryllup = p.bryllup_dato || (pp && pp.bryllup_dato) || "";
  const ptype = p.partner_type || (pp && pp.partner_pid === pid && pp.partner_type) || (bryllup ? "gift" : "");
  const alder = (() => { if (!p.foedselsdato) return ""; const f = new Date(p.foedselsdato), t = p.status === "afdød" ? new Date(p.status_dato || "") : new Date(); if (isNaN(t)) return ""; let a = t.getFullYear() - f.getFullYear(); if (t.getMonth() < f.getMonth() || (t.getMonth() === f.getMonth() && t.getDate() < f.getDate())) a--; return a; })();
  const retUrl = r.kilde === "kartotek" ? "medlemskartotek.html?rediger=" + encodeURIComponent(r.nr) : "medlemskartotek.html?ret_afdod=" + encodeURIComponent(pid);
  const k = (txt, data, kl) => ret ? `<button class="btn lille ${kl || ""}" ${data}>${txt}</button>` : "";

  // Forslag ud fra husstanden
  const forslag = [];
  if (ret && r.kilde === "kartotek") {
    const hus = [...P.keys()].filter(x => x !== pid && P.get(x).kilde === "kartotek" && P.get(x).nr === r.nr && P.get(x).p.status !== "udmeldt");
    const erVoksen = VOKSEN.has(String(p.rolle || "").toLowerCase());
    const andreVoksne = hus.filter(x => VOKSEN.has(String(P.get(x).p.rolle || "").toLowerCase()) && !partner(x));
    if (erVoksen && !pa && andreVoksne.length === 1) forslag.push(`<div class="forslag">💑 Er <b>${esc(fn)}</b> og <b>${esc(fornavn(andreVoksne[0]))}</b> et par? <button class="btn lille gron" data-forslag-par="${andreVoksne[0]}">Ja</button></div>`);
    const boernUden = hus.filter(x => String(P.get(x).p.rolle || "").toLowerCase() === "barn" && !P.get(x).p.far_pid && !P.get(x).p.mor_pid);
    if (erVoksen && boernUden.length) forslag.push(`<div class="forslag">👶 Er <b>${esc(fn)}</b> forælder til ${boernUden.map(x => "<b>" + esc(fornavn(x)) + "</b>").join(", ")}? <button class="btn lille gron" data-forslag-boern="far">Ja – far</button> <button class="btn lille gron" data-forslag-boern="mor">Ja – mor</button></div>`);
  }

  $("main").innerHTML = `
  <div class="kort">
    <div class="hoved">
      ${p.foto ? `<img class="foto" src="${esc(p.foto)}" alt="" data-stort="${esc(n)}" title="Tryk for at se billedet stort">` : `<div class="foto uden">📷<small>Billede mangler</small></div>`}
      <div style="flex:1;min-width:240px">
        <div class="navn">${esc(n)}${p.status === "afdød" ? " 🕯️" : ""}</div>
        ${p.tidligere_navne ? `<div class="linje">📝 Tidligere navne: ${esc(p.tidligere_navne)}</div>` : ""}
        ${p.foedselsdato ? `<div class="linje">🎂 Født ${dato(p.foedselsdato)}</div>` : ""}
        ${p.status === "afdød" ? `<div class="linje">🕯️ Død ${dato(p.status_dato) || "(dato mangler)"}${alder !== "" ? ` · ${alder} år` : ""}</div>` : (alder !== "" ? `<div class="linje">${alder} år</div>` : "")}
        <div class="linje">${r.kilde === "kartotek" ? `📇 Medlemsnr. ${esc(personNr(r))} · ${esc(r.husNavn)}` : "🌿 I Slægten (ikke på et medlemskort)"}</div>
        ${p.bekraeftet && p.bekraeftet.navn ? `<div class="ok">✅ Data bekræftet af ${esc(p.bekraeftet.navn)} (${dato(p.bekraeftet.dato)})</div>` : ""}
        ${mgl.length ? `<div class="mangler">🔴 Mangler: ${esc(mgl.join(", "))}</div><div class="hjaelp">🙏 <b>Hjælp med at gøre ${esc((p.fornavn || n).split(" ")[0])} færdig.</b> Har du et billede eller kender du datoerne? Så tryk <b>✏️ Ret data</b> herunder – eller send det til 5-Banden.</div>` : ""}
        <div class="knapper">
          ${ER_ADMIN || ret ? `<a class="btn" href="${retUrl}">✏️ Ret data</a>` : ""}
          <a class="btn" href="stamtrae.html?top=${encodeURIComponent(pid)}">🌳 Vis i stamtræet</a>
          ${p.status === "afdød" ? `<a class="btn" href="mindelunden.html">🕯️ Mindelunden</a>` : ""}
        </div>
      </div>
    </div>
    ${p.mindeord ? `<div class="felt-titel">🕯️ Mindeord</div><div class="tekst">${esc(p.mindeord)}</div>` : ""}
    ${p.fortaelling ? `<div class="felt-titel">📖 Fortælling</div><div class="tekst">${esc(p.fortaelling)}</div>` : ""}
    ${p.gravsted || p.grav_foto ? `<div class="felt-titel">🪦 Gravsted</div><div>${esc(p.gravsted || "")}${p.gravsted_note ? " – " + esc(p.gravsted_note) : ""}</div>${p.grav_foto ? `<img class="grav-foto" src="${esc(p.grav_foto)}" alt="Gravsted" data-stort="Gravsted – ${esc(n)}" title="Tryk for at se billedet stort">` : ""}` : ""}
  </div>

  <div class="kort" id="relationer">
    <h2>🔗 ${esc(fn)}s relationer</h2>
    ${ret ? '<div class="hjaelp">Her vælger du de nærmeste relationer. Børnebørn, bedsteforældre osv. findes automatisk.</div>' : ""}
    ${forslag.length ? `<div class="forslag-boks"><div class="gen-titel">💡 Forslag</div>${forslag.join("")}</div>` : ""}
    ${relRad("Far", p.far_pid && P.has(p.far_pid) ? [p.far_pid] : [], (p.far_pid ? k("Skift", 'data-rel="far"') + k("✕", 'data-fjern="far"') : k("➕ Vælg far", 'data-rel="far"', "gron")))}
    ${relRad("Mor", p.mor_pid && P.has(p.mor_pid) ? [p.mor_pid] : [], (p.mor_pid ? k("Skift", 'data-rel="mor"') + k("✕", 'data-fjern="mor"') : k("➕ Vælg mor", 'data-rel="mor"', "gron")))}
    ${relRad(`Ægtefælle / partner${pa ? `<div class="rel-under">${ptype === "gift" ? "⚭ Gift" + (bryllup ? " " + dato(bryllup) : ' – <span style="color:var(--roed)">bryllupsdato mangler</span>') : (ptype === "samlever" ? "Samlevende" : (ptype === "kaereste" ? "Kærester" : ""))}</div>` : ""}`, pa ? [pa] : [], (pa ? k("Ret", 'data-rel="partner"') + k("✕", 'data-fjern="partner"') : k("➕ Vælg ægtefælle / partner", 'data-rel="partner"', "gron")))}
    ${(() => { const tl = tidligere(pid);
      return `<div class="rel-rad"><div class="rel-titel">Tidligere ægtefælle / partner</div><div class="rel-indhold">${tl.length ? tl.map(t => `<div style="margin:2px 0"><div class="chips" style="display:inline-flex">${chip(t.pid)}</div> <span class="rel-under" style="display:inline">${tidlTekst(t)}</span> ${k("✕", `data-fjern-tidl="${esc(t.pid)}"`)}</div>`).join("") : '<span class="tom">Ingen</span>'}</div><div class="rel-knapper">${k("➕ Tilføj tidligere", 'data-rel="tidligere"')}</div></div>`; })()}
    ${relRad("Børn", sorterAlder(b), k("➕ Tilføj barn", 'data-rel="barn"', "gron"))}
    ${relRad("Søskende", sorterAlder(soeskende(pid)), k("➕ Tilføj søster/bror", 'data-rel="soeskende"', "gron"))}
    <details class="flere"><summary>Flere relationer (bonusforældre / bonusbørn)</summary>
      ${relRad("Bonusforældre", bonusForaeldre(pid), (bonusForaeldre(pid).length < 2 ? k("➕ Tilføj bonusforælder", 'data-rel="bonus"') : "") + (bonusForaeldre(pid).length ? k("✕ Fjern", 'data-fjern="bonus"') : ""))}
      ${relRad("Bonusbørn", bonusBoern(pid), "")}
    </details>
    <div id="rel-editor" class="rel-editor" style="display:none"></div>
  </div>

  <div class="kort">
    <h2>👪 ${esc(fn)}s nærmeste familie</h2>
    <h3 class="sek">⬆️ Op i slægten</h3>
    ${gen("Forældre", far)}
    ${gen("Bedsteforældre", bedste)}
    ${olde.length ? gen("Oldeforældre", olde) : ""}
    <h3 class="sek">↔️ Ved siden af</h3>
    ${gen("Ægtefælle / partner", pa ? [pa] : [])}
    ${tidligere(pid).length ? gen("Tidligere ægtefælle / partner", tidligere(pid).map(t => t.pid)) : ""}
    ${(() => { const tl = tidligere(pid).map(t => t.pid); const m = unik(b.flatMap(x => foraeldre(x))).filter(x => x !== pid && x !== pa && !tl.includes(x)); return m.length ? gen("Forælder til fælles børn", m) : ""; })()}
    ${gen("Søskende", soeskende(pid))}
    <h3 class="sek">⬇️ Ned i slægten</h3>
    ${gen("Børn", b)}
    ${gen("Børnebørn", bb)}
    ${obb.length ? gen("Oldebørn", obb) : ""}
  </div>
  <datalist id="alle-pers">${[...P.keys()].filter(x => x !== pid).sort((a, c) => etiket(a).localeCompare(etiket(c), "da", { numeric: true })).map(x => `<option value="${esc(etiket(x))}"></option>`).join("")}</datalist>`;

  $("relationer").addEventListener("click", e => {
    const rl = e.target.closest("[data-rel]"); if (rl) return aabnEditor(pid, rl.dataset.rel);
    const ft = e.target.closest("[data-fjern-tidl]"); if (ft) return fjernTidl(pid, ft.dataset.fjernTidl);
    const fj = e.target.closest("[data-fjern]"); if (fj) return fjern(pid, fj.dataset.fjern);
    const fp = e.target.closest("[data-forslag-par]"); if (fp) return aabnEditor(pid, "partner", fp.dataset.forslagPar);
    const fb = e.target.closest("[data-forslag-boern]"); if (fb) return forslagBoern(pid, fb.dataset.forslagBoern);
  });
  if (aabenRel) $("relationer").scrollIntoView({ behavior: "smooth" });
}

// ── Editor til én relation ──
const REL_TITEL = { tidligere: "tidligere ægtefælle / partner", far: "far", mor: "mor", partner: "ægtefælle / partner", barn: "barn", soeskende: "søster eller bror", bonus: "bonusforælder" };
function aabnEditor(pid, type, forvalgt) {
  const ed = $("rel-editor"), fn = fornavn(pid), cur = P.get(pid).p;
  const pa = partner(pid), pp = pa ? P.get(pa).p : null;
  const harNu = type === "far" ? cur.far_pid : type === "mor" ? cur.mor_pid : type === "partner" ? pa : "";
  const forPid = forvalgt || harNu || "";
  ed.style.display = "block";
  ed.innerHTML = `
    <div class="gen-titel">${type === "barn" ? "➕ Tilføj et barn til " + esc(fn) : type === "soeskende" ? "➕ Tilføj en søster eller bror til " + esc(fn) : "Vælg " + esc(fn) + "s " + REL_TITEL[type]}</div>
    <div class="form-gitter">
      <label>Findes personen allerede?<select id="e-findes"><option value="findes">Ja – vælg fra kartoteket/Slægten</option><option value="ny">Nej – opret en ny person</option></select></label>
      <label class="e-findes">Vælg personen<input id="e-vaelg" list="alle-pers" placeholder="Skriv navn eller medlemsnr., fx 22-B" value="${forPid ? esc(etiket(forPid)) : ""}"></label>
      ${type === "barn" ? `<label>${esc(fn)} er barnets<select id="e-rolle"><option value="far">far</option><option value="mor">mor</option></select></label>` : ""}
      ${type === "partner" ? `<label>Forhold<select id="e-ptype"><option value="gift">Gift</option><option value="samlever">Samlevende</option><option value="kaereste">Kærester</option></select></label>
        <label id="e-bryllup-lbl">⚭ Bryllupsdato *<input type="date" id="e-bryllup" value="${esc(cur.bryllup_dato || (pp && pp.bryllup_dato) || "")}"></label>
        <label id="e-besked-lbl" style="grid-column:1/-1">💬 Besked om bryllupsdagen (frivillig – vises på forsiden op til dagen)<input id="e-besked" placeholder="Fx: Morgenkaffe kl. 10 – alle er velkomne" value="${esc(cur.bryllup_besked || (pp && pp.bryllup_besked) || "")}"></label>` : ""}
      ${type === "tidligere" ? `<label>Forhold<select id="e-ptype"><option value="gift">Gift</option><option value="samlever">Samlevende</option><option value="kaereste">Kærester</option></select></label>
        <label>Gift / sammen fra (dato eller år – frivillig)<input id="e-fra" placeholder="Fx 1945"></label>
        <label>Hvordan sluttede det?<select id="e-slut"><option value="skilt">Skilt</option><option value="slut">Gået fra hinanden</option><option value="død">Ægtefællen døde</option><option value="">Ved ikke</option></select></label>
        <label>Hvornår sluttede det? (frivillig)<input id="e-til" placeholder="Fx 1960"></label>` : ""}
      <label class="e-ny">Fornavn *<input id="e-fornavn"></label>
      <label class="e-ny">Mellemnavn<input id="e-mellemnavn"></label>
      <label class="e-ny">Efternavn<input id="e-efternavn"></label>
      <label class="e-ny">Født<input type="date" id="e-foedt"></label>
      <label class="e-ny">Status<select id="e-status"><option value="">Lever / ukendt</option><option value="afdød">Afdød</option></select></label>
      <label class="e-ny">Død<input type="date" id="e-doed"></label>
    </div>
    <div class="knapper"><button class="btn gron" id="e-gem">💾 Gem</button><button class="btn" id="e-luk">Annullér</button><span id="e-st" style="font-size:14px;align-self:center"></span></div>
    <div class="hjaelp e-ny">En ny person oprettes i Slægten (ikke som medlem). Skal personen være medlem, så opret medlemmet i kartoteket først.</div>`;
  const opd = () => { const ny = $("e-findes").value === "ny";
    ed.querySelectorAll(".e-ny").forEach(x => x.style.display = ny ? "" : "none");
    ed.querySelectorAll(".e-findes").forEach(x => x.style.display = ny ? "none" : ""); };
  $("e-findes").onchange = opd; opd();
  if (type === "partner") {
    const pt = cur.partner_type || (pp && pp.partner_type) || ((cur.bryllup_dato || (pp && pp.bryllup_dato)) ? "gift" : "gift");
    $("e-ptype").value = pt;
    const opdB = () => { const g = $("e-ptype").value === "gift"; $("e-bryllup-lbl").style.display = g ? "" : "none"; $("e-besked-lbl").style.display = g ? "" : "none"; };
    $("e-ptype").onchange = opdB; opdB();
  }
  $("e-luk").onclick = () => { ed.style.display = "none"; };
  $("e-gem").onclick = () => gemRelation(pid, type);
  ed.scrollIntoView({ behavior: "smooth", block: "center" });
}

async function gemRelation(pid, type) {
  const st = $("e-st"), v = id => ($(id) ? $(id).value.trim() : "");
  const cur = P.get(pid).p;
  let anden;
  if (v("e-findes") === "ny") {
    if (!v("e-fornavn")) { st.textContent = "Fornavn mangler."; return; }
    anden = null;
  } else {
    anden = findEtiket(v("e-vaelg"));
    if (!anden) { st.textContent = "Personen blev ikke fundet – vælg fra listen."; return; }
    if (anden === pid) { st.textContent = "Det er den samme person."; return; }
  }
  // Spærre mod umulige relationer (fx at ægtefællen vælges som far)
  if (anden) {
    const fnA = fornavn(anden), fnC = fornavn(pid);
    const efterkommere = (x, set = new Set()) => { boern(x).forEach(c => { if (!set.has(c)) { set.add(c); efterkommere(c, set); } }); return set; };
    const forfaedre = (x, set = new Set()) => { foraeldre(x).forEach(c => { if (!set.has(c)) { set.add(c); forfaedre(c, set); } }); return set; };
    if ((type === "far" || type === "mor" || type === "bonus") && (anden === partner(pid) || efterkommere(pid).has(anden))) {
      st.textContent = `${fnA} kan ikke være ${fnC}s ${REL_TITEL[type]} – ${fnA} er ${fnC}s ${anden === partner(pid) ? "ægtefælle/partner" : "barn eller efterkommer"}.`; return; }
    if (type === "barn" && (anden === partner(pid) || forfaedre(pid).has(anden))) {
      st.textContent = `${fnA} kan ikke være ${fnC}s barn – ${fnA} er ${fnC}s ${anden === partner(pid) ? "ægtefælle/partner" : "forælder eller forfader"}.`; return; }
    if (type === "tidligere" && anden === partner(pid)) { st.textContent = `${fnA} er ${fnC}s nuværende ægtefælle/partner. Fjern først den kobling.`; return; }
    if ((type === "partner" || type === "tidligere") && (efterkommere(pid).has(anden) || forfaedre(pid).has(anden) || soeskende(pid).includes(anden))) {
      st.textContent = `${fnA} kan ikke være ${fnC}s ægtefælle – de er i familie (forælder, barn eller søskende).`; return; }
  }
  if (type === "partner" && v("e-ptype") === "gift" && !v("e-bryllup")) { st.textContent = "Skriv bryllupsdatoen – så kan mærkedagene regnes ud."; $("e-bryllup").focus(); return; }
  if (type === "soeskende" && !cur.far_pid && !cur.mor_pid && (!anden || (!P.get(anden).p.far_pid && !P.get(anden).p.mor_pid))) {
    st.textContent = `Søskende kobles via fælles forældre. Vælg først ${fornavn(pid)}s far eller mor.`; return;
  }
  $("e-gem").disabled = true; st.textContent = "Gemmer …";
  try {
    if (!anden) {
      const ny = { type: "slaegt", til: [], pid: nyPid(), fornavn: v("e-fornavn"), mellemnavn: v("e-mellemnavn"), efternavn: v("e-efternavn"),
        foedselsdato: v("e-foedt"), status: v("e-status"), status_dato: v("e-status") === "afdød" ? v("e-doed") : "",
        fortaelling: "", foto: "", mindeord: "", gravsted: "", grav_foto: "", far_pid: "", mor_pid: "", partner_pid: "",
        oprettet: new Date().toISOString().slice(0, 10), oprettet_af: hent("ok_nr") };
      ny.navn = [ny.fornavn, ny.mellemnavn, ny.efternavn].filter(Boolean).join(" ");
      await setDoc(doc(db, "olsenpost", "slaegt_" + ny.pid), ny);
      P.set(ny.pid, { p: ny, nr: "", kilde: "slaegt", husNavn: "Slægten" });
      anden = ny.pid;
    }
    const oth = P.get(anden).p;
    if (type === "far" || type === "mor") await saetFelter(pid, { [type + "_pid"]: anden });
    else if (type === "bonus") await saetFelter(pid, { [cur.bonus1_pid ? "bonus2_pid" : "bonus1_pid"]: anden });
    else if (type === "barn") await saetFelter(anden, { [v("e-rolle") === "mor" ? "mor_pid" : "far_pid"]: pid });
    else if (type === "partner") {
      // Fjern en gammel partner-kobling, så der kun er én
      const gl = partner(pid);
      if (gl && gl !== anden && confirm(`Skal ${fornavn(gl)} gemmes som ${fornavn(pid)}s tidligere ægtefælle/partner?`)) {
        const l = (cur.tidligere_partnere || []).filter(t => t && t.pid !== gl);
        l.push({ pid: gl, type: cur.partner_type || P.get(gl).p.partner_type || "gift", fra: (cur.bryllup_dato || P.get(gl).p.bryllup_dato || "").slice(0, 10), slut: "", til: "" });
        await saetFelter(pid, { tidligere_partnere: l });
      }
      if (gl && gl !== anden && P.get(gl).p.partner_pid === pid) await saetFelter(gl, { partner_pid: "", partner_type: "", bryllup_dato: "" });
      if (oth.partner_pid && oth.partner_pid !== pid) await saetFelter(anden, { partner_pid: "" });
      const pt = v("e-ptype");
      await saetFelter(pid, { partner_pid: anden, partner_type: pt, bryllup_dato: pt === "gift" ? v("e-bryllup") : "", bryllup_besked: pt === "gift" ? v("e-besked") : "" });
      if (oth.bryllup_dato && pt === "gift" && oth.bryllup_dato !== v("e-bryllup")) await saetFelter(anden, { bryllup_dato: "" });
    }
    else if (type === "tidligere") {
      const liste = (cur.tidligere_partnere || []).filter(t => t && t.pid !== anden);
      liste.push({ pid: anden, type: v("e-ptype"), fra: v("e-fra"), slut: v("e-slut"), til: v("e-til") });
      await saetFelter(pid, { tidligere_partnere: liste });
      // Står den samme kobling også hos den anden, fjernes den der (så den kun findes ét sted)
      if ((oth.tidligere_partnere || []).some(t => t && t.pid === pid)) await saetFelter(anden, { tidligere_partnere: oth.tidligere_partnere.filter(t => t && t.pid !== pid) });
    }
    else if (type === "soeskende") {
      if (cur.far_pid || cur.mor_pid) {
        const f = {}; if (cur.far_pid && !oth.far_pid) f.far_pid = cur.far_pid; if (cur.mor_pid && !oth.mor_pid) f.mor_pid = cur.mor_pid;
        if (Object.keys(f).length) await saetFelter(anden, f);
      } else {
        const f = {}; if (oth.far_pid) f.far_pid = oth.far_pid; if (oth.mor_pid) f.mor_pid = oth.mor_pid;
        await saetFelter(pid, f);
      }
    }
    vis(pid, true);
  } catch(e) { st.textContent = "Kunne ikke gemme: " + (e.message || e); $("e-gem").disabled = false; }
}

async function fjern(pid, type) {
  const cur = P.get(pid).p, fn = fornavn(pid);
  if (type === "far" || type === "mor") {
    if (!confirm(`Fjern ${fn}s ${type}?`)) return;
    await saetFelter(pid, { [type + "_pid"]: "" });
  } else if (type === "partner") {
    const pa = partner(pid); if (!pa) return;
    if (!confirm(`Fjern koblingen mellem ${fn} og ${fornavn(pa)}?`)) return;
    if (cur.partner_pid) await saetFelter(pid, { partner_pid: "", partner_type: "", bryllup_dato: "" });
    if (P.get(pa).p.partner_pid === pid) await saetFelter(pa, { partner_pid: "", partner_type: "", bryllup_dato: "" });
  } else if (type === "bonus") {
    if (!confirm(`Fjern ${fn}s bonusforældre?`)) return;
    await saetFelter(pid, { bonus1_pid: "", bonus2_pid: "" });
  }
  vis(pid, true);
}

async function fjernTidl(pid, anden) {
  if (!confirm(`Fjern ${fornavn(anden)} som tidligere ægtefælle/partner til ${fornavn(pid)}?`)) return;
  for (const [a, b] of [[pid, anden], [anden, pid]]) {
    const l = P.get(a).p.tidligere_partnere || [];
    if (l.some(t => t && t.pid === b)) await saetFelter(a, { tidligere_partnere: l.filter(t => t && t.pid !== b) });
  }
  vis(pid, true);
}

async function forslagBoern(pid, rolle) {
  const r = P.get(pid);
  const hus = [...P.keys()].filter(x => x !== pid && P.get(x).kilde === "kartotek" && P.get(x).nr === r.nr && String(P.get(x).p.rolle || "").toLowerCase() === "barn" && !P.get(x).p.far_pid && !P.get(x).p.mor_pid);
  for (const x of hus) await saetFelter(x, { [rolle + "_pid"]: pid });
  vis(pid, true);
}

function etiket(x) { const r = P.get(x); const nr = personNr(r); const f = (r.p.foedselsdato || "").slice(0, 4); return `${nr ? nr : "Slægten"} · ${navnAf(r.p)}${f ? " (f. " + f + ")" : ""}`; }
function findEtiket(t) {
  t = String(t || "").trim().toLowerCase(); if (!t) return null;
  const alle = [...P.keys()];
  const e = alle.find(x => etiket(x).toLowerCase() === t); if (e) return e;
  const nr = alle.filter(x => etiket(x).toLowerCase().startsWith(t + " ·")); if (nr.length === 1) return nr[0];
  const n = alle.filter(x => etiket(x).toLowerCase().includes(t)); return n.length === 1 ? n[0] : null;
}
function nyPid() { let id; do { id = "p" + Math.random().toString(36).slice(2, 11).padEnd(9, "0"); } while (P.has(id)); return id; }

// Sæt et felt på en eksisterende person (kartotek eller Slægten)
async function saetFelter(pid, felter) {
  const r = P.get(pid);
  if (r.kilde === "slaegt") { await setDoc(doc(db, "olsenpost", "slaegt_" + pid), felter, { merge: true }); Object.assign(r.p, felter); return; }
  const s = await getDoc(doc(db, "membres", r.nr));
  const fm = (s.data().familiemedlemmer || []).map(x => x.pid === pid ? { ...x, ...felter } : x);
  await setDoc(doc(db, "membres", r.nr), { familiemedlemmer: fm }, { merge: true });
  Object.assign(r.p, felter);
}

try {
  await hentData();
  const q = new URLSearchParams(location.search);
  vis(q.get("pid"), q.get("rel") === "1");
} catch(e) { $("main").innerHTML = '<div class="kort">Kunne ikke hente data: ' + esc(e.message || e) + '</div>'; }
</script>
