<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OlsenKlanen · Mine lykønskninger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Georgia, 'Times New Roman', serif; background: #f5f1e8; color: #2c3e1f; line-height: 1.5; padding-bottom: 60px; }

.topbar { background: #2d5016; color: #f5e6a8; padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.topbar h1 { font-size: 22px; font-weight: normal; }
.topbar .user { display: flex; align-items: center; gap: 14px; font-style: italic; font-size: 15px; }
.hjem-knap { color: #f5e6a8; text-decoration: none; padding: 6px 14px; border: 1px solid #f5e6a8; border-radius: 4px; font-size: 14px; font-style: normal; }
.hjem-knap:hover { background: rgba(245,230,168,0.15); }

.wrap { max-width: 800px; margin: 0 auto; padding: 20px 16px; }
.overskrift { text-align: center; margin: 10px 0 24px; }
.overskrift .tillykke { font-family: 'Pacifico', cursive; font-size: 40px; color: #b8860b; line-height: 1.3; }
.overskrift .under { font-size: 18px; color: #2d5016; }

.aar-titel { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 19px; color: #2d5016; margin: 26px 0 12px; border-bottom: 2px solid #d8cfae; padding-bottom: 6px; }
.aar-titel .antal { background: #c89e3c; color: #fff; border-radius: 12px; font-size: 13px; padding: 1px 10px; }
.kort-knap { margin-left: auto; background: #fff3cd; color: #856404; border: 1px solid #e6c65c; border-radius: 14px; font-family: inherit; font-size: 14px; padding: 5px 14px; text-decoration: none; white-space: nowrap; }
.kort-knap:hover { background: #ffe9a8; }

.hilsen { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 16px 20px; margin-bottom: 12px; border-left: 4px solid #c89e3c; }
.hilsen .fra { font-weight: bold; color: #2d5016; font-size: 16px; }
.hilsen .tid { float: right; font-size: 13px; color: #999; font-style: italic; }
.hilsen .tekst { white-space: pre-wrap; margin-top: 8px; font-size: 16px; }

.tom { background: #fff; border-radius: 8px; padding: 30px 20px; text-align: center; color: #777; font-style: italic; }
.hint { text-align: center; color: #8a7a3f; font-size: 14px; font-style: italic; margin-top: 20px; }
</style>

<script>
try {
  function hent(navn){ return sessionStorage.getItem(navn) || localStorage.getItem(navn) || ""; }
  const niveau = hent("ok_niveau"), navn = hent("ok_navn"), nr = hent("ok_nr");
  if (niveau || navn || nr) {
    if (niveau) sessionStorage.setItem("ok_niveau", niveau);
    if (navn)   sessionStorage.setItem("ok_navn", navn);
    if (nr)     sessionStorage.setItem("ok_nr", nr);
  } else {
    window.location.href = "login.html";
  }
} catch(e) {}
</script>
</head>
<body>

<div class="topbar">
  <h1>💌 Mine lykønskninger</h1>
  <div class="user">
    <span id="mit-navn"></span>
    <a class="hjem-knap" href="forside.html">🏠 Til forsiden</a>
  </div>
</div>

<div class="wrap">
  <div class="overskrift">
    <div class="tillykke">Tillykke!</div>
    <div class="under" id="under-tekst">Her kan du læse de hilsner, familien har sendt dig.</div>
  </div>
  <div id="liste"><div class="tom">Henter dine hilsner …</div></div>
  <p class="hint">Hilsnerne er også sendt til din mail. Siden viser kun dine egne hilsner.</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDlydsBrJQswqtiqTLM4yXDQWHbAolMpZU",
  authDomain: "olsenklanen-familieside.firebaseapp.com",
  projectId: "olsenklanen-familieside",
  storageBucket: "olsenklanen-familieside.firebasestorage.app",
  messagingSenderId: "640843662410",
  appId: "1:640843662410:web:e749b77ec9271e75c4d2b3"
});
const db = getFirestore(app);

function hent(n){ return sessionStorage.getItem(n) || localStorage.getItem(n) || ""; }
const MIT_NR   = hent("ok_nr");
const MIT_NAVN = hent("ok_navn");
document.getElementById("mit-navn").textContent = MIT_NAVN + (MIT_NR ? " (nr. " + MIT_NR + ")" : "");

function escHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
const MAANEDER = ["januar","februar","marts","april","maj","juni","juli","august","september","oktober","november","december"];
function datoTekst(ms){
  if (!ms) return "";
  const d = new Date(ms);
  return d.getDate() + ". " + MAANEDER[d.getMonth()] + " " + d.getFullYear() + " kl. " + String(d.getHours()).padStart(2,"0") + "." + String(d.getMinutes()).padStart(2,"0");
}

// Find mig selv i kartoteket: husstandsnummer + fornavn (samme måde som på forsiden)
async function findMig(){
  const hus = MIT_NR.split("-")[0].trim();
  const fornavn = (MIT_NAVN || "").trim().split(/\s+/)[0].toLowerCase();
  if (!hus || !fornavn) return null;
  const snap = await getDocs(collection(db, "membres"));
  let mig = null;
  snap.forEach(d => {
    if (mig || String(d.id) !== hus) return;
    (d.data().familiemedlemmer || []).forEach(p => {
      const fn = (p.fornavn || (p.navn || "").trim().split(/\s+/)[0] || "").trim();
      if (!mig && p.foedselsdato && fn.toLowerCase() === fornavn) mig = { fornavn: fn, foedselsdato: p.foedselsdato };
    });
  });
  return mig;
}

(async () => {
  const el = document.getElementById("liste");
  try {
    const mig = await findMig();
    if (!mig) { el.innerHTML = '<div class="tom">Vi kunne ikke finde din fødselsdato i kartoteket.</div>'; return; }

    // Alle hilsner til mig — nøglen er "år|fornavn|fødselsdato"
    const slut = "|" + mig.fornavn + "|" + mig.foedselsdato;
    const snap = await getDocs(collection(db, "hilsener"));
    const perAar = {};
    snap.forEach(d => {
      const h = d.data();
      if (!h.tilNoegle || !h.tilNoegle.endsWith(slut)) return;
      const aar = h.tilNoegle.split("|")[0];
      (perAar[aar] = perAar[aar] || []).push(h);
    });

    const aarListe = Object.keys(perAar).sort((a, b) => b - a);
    if (!aarListe.length) { el.innerHTML = '<div class="tom">Du har ikke fået nogen hilsner endnu. 🎈</div>'; return; }

    const foedAar = parseInt(mig.foedselsdato.slice(0, 4));
    document.getElementById("under-tekst").textContent = "Kære " + mig.fornavn + " — her kan du læse de hilsner, familien har sendt dig.";
    el.innerHTML = aarListe.map(aar => {
      const hilsner = perAar[aar].sort((a, b) => (b.sendt || 0) - (a.sendt || 0));
      const noegle = aar + slut;
      return `
        <div class="aar-titel">🎂 ${parseInt(aar) - foedAar} år · ${aar}
          <span class="antal">${hilsner.length} ${hilsner.length === 1 ? "hilsen" : "hilsner"}</span>
          ${String(aar) === String(new Date().getFullYear()) ? `<a class="kort-knap" href="forside.html?kort=${encodeURIComponent(noegle)}">🎉 Se fødselsdagskort</a>` : ""}
        </div>
        ${hilsner.map(h => `
          <div class="hilsen">
            <span class="tid">${datoTekst(h.sendt)}</span>
            <div class="fra">Fra ${escHtml(h.fra || "et medlem")}</div>
            <div class="tekst">${escHtml(h.besked || "")}</div>
          </div>`).join("")}`;
    }).join("");
  } catch(e) {
    console.log("Kunne ikke hente hilsner:", e);
    el.innerHTML = '<div class="tom">Hilsnerne kunne ikke hentes. Prøv igen om lidt.</div>';
  }
})();
</script>

</body>
</html>
